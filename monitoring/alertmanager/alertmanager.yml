route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "page"
      receiver: oncall-page
      repeat_interval: 1h

# Receivers are intentionally webhook-free so this runs anywhere.
# Replace with slack_configs / pagerduty_configs / email_configs in real use.
receivers:
  - name: default
  - name: oncall-page

inhibit_rules:
  # If the whole service is down, silence the noisier symptom alerts.
  - source_matchers:
      - alertname = "ServiceDown"
    target_matchers:
      - severity =~ "page|ticket"
    equal: []

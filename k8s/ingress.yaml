apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sre-app
  namespace: sre-platform
spec:
  ingressClassName: nginx
  rules:
    - host: sre-app.example.com   # change to your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sre-app
                port:
                  name: http

# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: Render dashboard -> New -> Blueprint -> select this GitHub repo.
services:
  - type: web
    name: sre-reliability-platform
    runtime: docker
    plan: free
    healthCheckPath: /readyz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: CHAOS_ENABLED
        value: "false"
      - key: SHUTDOWN_DELAY_MS
        value: "3000"
